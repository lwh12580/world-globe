<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>世界地形地貌地球仪 · 七（5）班 赖秉权</title>
<style>
  :root{
    --ink:#e9f2fb;
    --ink-dim:#8fa8c4;
    --accent:#57c6f0;
    --line:rgba(120,180,230,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#03060d}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    color:var(--ink);
  }
  #globe{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #globe:active{cursor:grabbing}

  .hud{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(16px,3.4vw,40px);
  }

  /* ---------- 顶部标题 ---------- */
  .hud::before{
    content:"";position:absolute;left:0;right:0;top:0;height:clamp(150px,26vh,260px);
    background:linear-gradient(180deg, rgba(3,6,13,.86) 0%, rgba(3,6,13,.52) 48%, rgba(3,6,13,0) 100%);
    pointer-events:none;
  }
  header{text-align:center;position:relative}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:clamp(10px,1.5vw,12px);letter-spacing:.34em;
    color:var(--accent);text-transform:uppercase;opacity:.92;
    margin-bottom:clamp(8px,1.4vw,14px);
  }
  .eyebrow::before,.eyebrow::after{
    content:"";width:clamp(18px,4vw,42px);height:1px;
    background:linear-gradient(90deg,transparent,var(--accent));
  }
  .eyebrow::after{background:linear-gradient(90deg,var(--accent),transparent)}
  h1{
    font-size:clamp(23px,4.6vw,44px);
    font-weight:700;letter-spacing:.10em;line-height:1.18;
    background:linear-gradient(180deg,#ffffff 10%,#a9d6f5 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(70,170,240,.18);
  }
  .sub{
    margin-top:clamp(6px,1vw,10px);
    font-size:clamp(10px,1.5vw,13px);letter-spacing:.22em;
    color:var(--ink-dim);font-weight:400;
  }
  .seasoncap{
    display:none;position:relative;margin-top:clamp(10px,1.6vw,16px);
    font-size:clamp(10px,1.4vw,13px);letter-spacing:.10em;color:#ffe6a8;
  }
  .seasoncap.show{display:block}

  /* ---------- 二维码卡片 ---------- */
  .qrcard{
    position:fixed;top:clamp(14px,3vw,34px);right:clamp(14px,3vw,34px);
    pointer-events:auto;
    background:rgba(9,20,36,.60);
    border:1px solid var(--line);border-radius:14px;
    padding:clamp(8px,1.2vw,12px);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    text-align:center;z-index:8;
  }
  .qrcard #qrbox{width:clamp(84px,10vw,116px);height:clamp(84px,10vw,116px);background:#fff;border-radius:9px;padding:5px}
  .qrcard #qrbox svg{display:block;width:100%;height:100%}
  .qrcard .qrtxt{
    margin-top:6px;font-size:clamp(9px,1.15vw,11px);letter-spacing:.14em;color:var(--ink-dim);
  }

  /* ---------- 底部区 ---------- */
  .bottom{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:clamp(10px,2vw,24px);flex-wrap:wrap;
  }

  .legend{
    pointer-events:auto;
    background:rgba(9,20,36,.55);
    border:1px solid var(--line);
    border-radius:14px;
    padding:clamp(10px,1.6vw,16px) clamp(12px,1.8vw,18px);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    max-width:clamp(240px,36vw,360px);
  }
  .legend h2{
    font-size:clamp(9px,1.25vw,11px);font-weight:600;letter-spacing:.2em;
    color:var(--accent);margin-bottom:clamp(7px,1.1vw,10px);text-transform:uppercase;
  }
  .basenote{
    font-size:clamp(9px,0.78vw,10.5px);color:#8fb6d8;margin-top:-2px;margin-bottom:6px;
    letter-spacing:.02em;
  }
  .legend h2.gap{margin-top:clamp(8px,1.2vw,12px)}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,.9vw,7px) clamp(10px,1.8vw,18px)}
  .row{display:flex;align-items:center;gap:clamp(5px,.9vw,8px);font-size:clamp(9.5px,1.3vw,12px);color:#c3d5e8;white-space:nowrap}
  .sw{width:clamp(10px,1.5vw,14px);height:clamp(7px,1.1vw,10px);border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
  .ln{width:clamp(14px,2vw,20px);height:2px;border-radius:2px;flex:0 0 auto}
  .ln.dash{background:repeating-linear-gradient(90deg,#73d9ff 0 5px,transparent 5px 9px)}
  .ln.wide{height:3px}
  .dots{display:flex;gap:2px;flex:0 0 auto}
  .dots i{width:6px;height:6px;border-radius:2px;display:block}

  /* ---------- 图层开关 ---------- */
  .panel{
    pointer-events:auto;
    background:rgba(9,20,36,.55);
    border:1px solid var(--line);border-radius:14px;
    padding:clamp(8px,1.2vw,12px);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    max-width:min(46vw,540px);
  }
  .group{display:flex;flex-wrap:wrap;gap:clamp(5px,.8vw,8px);align-items:center}
  .group + .group{
    margin-top:clamp(6px,.9vw,9px);padding-top:clamp(6px,.9vw,9px);
    border-top:1px solid rgba(120,180,230,.14);
  }
  .glab{font-size:clamp(9px,1.15vw,11px);letter-spacing:.18em;color:var(--ink-dim);margin-right:2px}
  .chip{
    appearance:none;border:1px solid var(--line);border-radius:99px;
    background:rgba(20,40,64,.45);color:var(--ink-dim);
    font-family:inherit;font-size:clamp(10px,1.3vw,12.5px);letter-spacing:.06em;
    padding:clamp(4px,.7vw,6px) clamp(10px,1.4vw,14px);cursor:pointer;
    transition:all .18s ease;white-space:nowrap;
  }
  .chip:hover{border-color:rgba(120,190,240,.5);color:var(--ink)}
  .chip.on{
    background:rgba(46,120,180,.32);border-color:rgba(87,198,240,.55);
    color:#d9f1ff;box-shadow:0 0 14px rgba(70,170,240,.18) inset;
  }
  .chip.on::before{content:"● ";font-size:.72em;vertical-align:.12em;color:var(--accent)}
  .chip:not(.on)::before{content:"○ ";font-size:.72em;vertical-align:.12em;opacity:.55}
  .chip.act{background:rgba(120,90,30,.28);border-color:rgba(255,200,90,.35);color:#ffe1a6}
  .chip.act::before{content:"⟳ ";font-size:.8em;color:#ffc85a}

  .credit{text-align:right;line-height:1.7;pointer-events:auto}
  .credit .who{
    font-size:clamp(13px,2vw,18px);font-weight:600;letter-spacing:.06em;
    color:#ffffff;
  }
  .credit .cls{
    display:inline-block;font-size:clamp(9px,1.2vw,11px);letter-spacing:.16em;
    color:var(--accent);border:1px solid var(--line);border-radius:99px;
    padding:2px 9px;margin-bottom:5px;
  }
  .credit .teach{font-size:clamp(10px,1.4vw,12.5px);color:var(--ink-dim);letter-spacing:.08em}

  /* ---------- 实时气温标注 ---------- */
  #wmarks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
  .wm{
    position:absolute;left:0;top:0;
    display:flex;align-items:baseline;gap:4px;
    padding:1px 6px;border-radius:99px;
    background:rgba(6,16,30,.66);border:1px solid rgba(180,205,235,.35);
    font-size:clamp(9px,1.15vw,11.5px);line-height:1.5;
    color:#eaf4ff;white-space:nowrap;will-change:transform;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .wm b{font-weight:600}
  .wm i{font-style:normal;font-weight:600;opacity:.95}
  .wm.c1{border-color:#6f7dff} .wm.c1 i{color:#8f9bff}
  .wm.c2{border-color:#4aa3ff} .wm.c2 i{color:#6fb7ff}
  .wm.c3{border-color:#38cfc9} .wm.c3 i{color:#5adcd6}
  .wm.c4{border-color:#7dd86a} .wm.c4 i{color:#97e486}
  .wm.c5{border-color:#ffcc4d} .wm.c5 i{color:#ffd76b}
  .wm.c6{border-color:#ff9a4d} .wm.c6 i{color:#ffb072}
  .wm.c7{border-color:#ff5f5f} .wm.c7 i{color:#ff8080}

  .tip{
    position:fixed;left:50%;bottom:clamp(8px,1.4vw,14px);transform:translateX(-50%);
    font-size:clamp(9px,1.2vw,11px);color:rgba(140,170,205,.55);letter-spacing:.16em;
    pointer-events:none;white-space:nowrap;
  }

  @media (max-width:860px){
    .bottom{align-items:stretch}
    .legend{max-width:none;flex:1 1 100%;order:2}
    .panel{max-width:none;order:1;flex:1 1 100%}
    .credit{order:3;text-align:left;flex:1 1 100%;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .credit .cls{margin:0}
    .qrcard{top:auto;bottom:clamp(10px,2vw,20px);right:clamp(10px,2vw,20px)}
    .tip{display:none}
  }
  @media (max-height:700px){
    .legend{display:none}
  }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<div id="wmarks"></div>

<div class="hud">
  <header>
    <div class="eyebrow">Geography · Science Project</div>
    <h1>世界地形地貌地球仪</h1>
    <div class="sub">分层设色地形 · 可旋转缩放 · 扫码即看</div>
    <div class="seasoncap" id="seasonCap"></div>
  </header>

  <div class="bottom">
    <section class="legend">
      <h2>地形地貌图例</h2>
      <div class="basenote" id="baseNote">底图：分层设色 + 地形晕渲</div>
      <div class="rows">
        <div class="row"><span class="sw" style="background:#3f9142"></span>平原</div>
        <div class="row"><span class="sw" style="background:#7cb84c"></span>丘陵</div>
        <div class="row"><span class="sw" style="background:#cab06a"></span>高原</div>
        <div class="row"><span class="sw" style="background:#8b5f3c"></span>山地</div>
        <div class="row"><span class="sw" style="background:#9bc4d6"></span>大陆架</div>
        <div class="row"><span class="sw" style="background:#0c2e52"></span>深海</div>
      </div>
      <h2 class="gap">辅元素图例</h2>
      <div class="rows">
        <div class="row"><span class="ln wide" style="background:#ffcc4d"></span>赤道</div>
        <div class="row"><span class="ln dash"></span>回归线／极圈</div>
        <div class="row"><span class="ln wide" style="background:#40beff"></span>主要河湖</div>
        <div class="row"><span class="ln" style="width:auto;height:auto;font-size:11px;color:#fff">洲·洋</span>大洲大洋</div>
        <div class="row"><span class="ln" style="background:#d4e0f0"></span>国界</div>
        <div class="row"><span class="ln wide" style="background:#ffd973"></span>晨昏线</div>
        <div class="row"><span class="dots"><i style="background:#6f7dff"></i><i style="background:#38cfc9"></i><i style="background:#7dd86a"></i><i style="background:#ffcc4d"></i><i style="background:#ff5f5f"></i></span>实时气温</div>
        <div class="row"><span class="ln" style="background:#eef4ff"></span>地轴</div>
      </div>
    </section>

    <div class="panel">
      <div class="group" id="panelMain">
        <button class="chip on" data-k="grid">经纬网</button>
        <button class="chip on" data-k="special">特殊纬线</button>
        <button class="chip on" data-k="borders">国界</button>
        <button class="chip on" data-k="rivers">主要河湖</button>
        <button class="chip on" data-k="labels">大洲大洋</button>
        <button class="chip" data-k="sat">卫星影像</button>
        <button class="chip" data-k="axis">地轴</button>
        <button class="chip" data-k="climate">实时气温</button>
        <button class="chip on" data-k="auto">自动旋转</button>
        <button class="chip act" data-k="flip">倒转视角</button>
      </div>
      <div class="group" id="panelSeason">
        <span class="glab">二分二至晨昏</span>
        <button class="chip" data-season="chunfen">春分</button>
        <button class="chip" data-season="xiazhi">夏至</button>
        <button class="chip" data-season="qiufen">秋分</button>
        <button class="chip" data-season="dongzhi">冬至</button>
      </div>
    </div>

    <div class="credit">
      <span class="cls">七（5）班</span>
      <span class="who">赖秉权</span>
      <div class="teach">指导老师：陈琳娜</div>
    </div>
  </div>
</div>

<div class="qrcard" id="qrcard">
  <div id="qrbox"></div>
  <div class="qrtxt">扫码 · 手机观看</div>
</div>

<div class="tip">拖动旋转 · 滚轮 / 双指缩放</div>

    "    float diff = clamp(dot(S, Lw), 0.0, 1.0);",
    "",
    "    float hh = h0 + dth;",
    "    vec3 base = (hh >= 0.0) ? landColor(hh) : oceanColor(hh);",
    "    /* 卫星影像（真实地表）底图 */",
    "    vec3 satc = clamp(texture2D(uSat, uv).rgb * 1.12, 0.0, 1.0);",
    "    satc = pow(satc, vec3(0.93));",
    "    base = mix(base, satc, uSatMix);",
    "    float ocean = step(hh, 0.0);",
    "",
    "    /* 极地冰盖 */",
    "    float ice = 0.0;",
    "    if(h0 > 0.0){",
    "      if(lat < radians(-63.0)) ice = 1.0;",
    "      if(lat > radians(60.0) && lon > radians(-73.0) && lon < radians(-12.0)) ice = 1.0;",
    "    }",
    "    base = mix(base, vec3(0.930,0.949,0.973), ice);",
    "",
    "    float shade = mix(0.40 + 0.62 * diff, 0.80 + 0.24 * diff, uSatMix);",
    "    vec3 lit = base * shade;",
    "",
    "    /* 海面微高光 */",
    "    vec3 Vw = vec3(0.0,0.0,1.0);",
    "    vec3 Hw = normalize(Lw + Vw);",
    "    float spec = pow(clamp(dot(S,Hw),0.,1.), 72.0) * 0.10 * ocean * (1.0-ice) * clamp(-hh/900.0, 0.0, 1.0);",
    "    lit += spec * (1.0 - uSatMix * 0.85);",
    "",
    "    /* 边缘大气 */",
    "    float rim = pow(1.0 - nz, 3.4) * 0.52;",
    "    lit += rim * vec3(0.35,0.63,0.92);",
    "",
    "    /* ---- 叠加：主要河湖 ---- */",
    "    vec4 rv = texture2D(uRivTex, uv);",
    "    lit = mix(lit, rv.rgb, rv.a * uRivers * 0.92);",
    "",
    "    /* ---- 叠加：各国行政边界 ---- */",
    "    vec4 bd = texture2D(uBorTex, uv);",
    "    lit = mix(lit, bd.rgb, bd.a * uBorders * 0.80);",
    "",
    "    /* ---- 叠加：大洲大洋标注 ---- */",
    "    vec4 lb = texture2D(uLabTex, uv);",
    "    lit = mix(lit, lb.rgb, lb.a * uLabels);",
    "",
    "    /* ---- 经纬网（每 30 度） ---- */",
    "    float lonD = degrees(lon);",
    "    float latD = degrees(lat);",
    "    float csl = max(cos(lat), 0.22);",
    "    float mx = abs(fract(lonD/30.0 + 0.5) - 0.5) * 30.0 / csl;",
    "    float my = abs(fract(latD/30.0 + 0.5) - 0.5) * 30.0;",
    "    float g1 = 1.0 - smoothstep(0.16, 0.62, mx);",
    "    float g2 = 1.0 - smoothstep(0.16, 0.62, my);",
    "    float gline = max(g1, g2);",
    "    lit = mix(lit, vec3(0.72,0.85,1.0), gline * 0.32 * uGrid);",
    "",
    "    /* ---- 特殊纬线：赤道 / 回归线 / 极圈 ---- */",
    "    float dEq = abs(latD);",
    "    float dTr = min(abs(latD - 23.44), abs(latD + 23.44));",
    "    float dPc = min(abs(latD - 66.56), abs(latD + 66.56));",
    "    float dash = step(fract(lonD / 9.0), 0.55);",
    "    float eqL = 1.0 - smoothstep(0.0, 0.60, dEq);",
    "    float trL = (1.0 - smoothstep(0.0, 0.50, dTr)) * dash;",
    "    float pcL = (1.0 - smoothstep(0.0, 0.50, dPc)) * dash;",
    "    vec3  spc = vec3(1.0,0.80,0.30) * eqL + vec3(0.45,0.85,1.0) * (trL + pcL);",
    "    lit = mix(lit, spc, clamp(eqL + trL + pcL, 0.0, 1.0) * 0.9 * uSpecial);",
    "",
    "    /* ---- 二分二至：晨昏线 / 昼夜半球 ---- */",
    "    if(uTerm > 0.5){",
    "      vec3 Sun = vec3(0.0, sin(uDecl), cos(uDecl));",
    "      float d = dot(P, Sun);",
    "      float night = 1.0 - smoothstep(-0.012, 0.012, d);",
    "      lit = mix(lit, lit * vec3(0.26,0.32,0.52), night * 0.92);",
    "      float tw = 1.0 - smoothstep(0.0, 0.034, abs(d));",
    "      lit = mix(lit, vec3(1.0,0.86,0.45), tw * 0.62);",
    "    }",
    "",
    "    col = lit;",
    "  }",
    "",
    "  /* ---- 地轴标识 ---- */",
    "  if(uAxis > 0.5){",
    "    float axw = 0.012 / max(uZoom, 0.6);",
    "    float cl2 = max(cos(uLat), 0.03);",
    "    float tt = -q.y / cl2;",
    "    float zax = abs(sin(uLat) * tt);",
    "    float zsurf = sqrt(max(1.0 - r2, 0.0));",
    "    float vis = (r2 > 1.0) ? 1.0 : step(zsurf, zax);",
    "    float inR = step(abs(tt), 1.55);",
    "    float axl = (1.0 - smoothstep(axw*0.45, axw, abs(q.x))) * vis * inR;",
    "    float capD = min(length(vec2(q.x, q.y - 1.5*cl2)), length(vec2(q.x, q.y + 1.5*cl2)));",
    "    float r2c = pow(1.5*cl2, 2.0);",
    "    float zc  = abs(sin(uLat)) * 1.5;",
    "    float zsc = sqrt(max(1.0 - r2c, 0.0));",
    "    float visc = (r2c > 1.0) ? 1.0 : step(zsc, zc);",
    "    float cap = (1.0 - smoothstep(0.008, 0.020, capD)) * visc;",
    "    float aa = clamp(axl*0.7 + cap*0.9, 0.0, 1.0);",
    "    col = mix(col, vec3(0.93,0.96,1.0), aa);",
    "  }",

    "  /* 轻微暗角 */",

  function makeTexture(unit){

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;

  function loadTexture(unit, url, mip){
    var tex = makeTexture(unit);

    img.onload = function(){
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if(mip){
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      }else{
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
    };
    img.src = url;
    return tex;
  }

    state.vLon = dx * k;
    state.vLat = dy * k;
    state.lon -= state.vLon;
    state.lat += state.vLat;

  /* 经纬 -> 屏幕（与着色器同一套视图变换） */
  function project(latDeg, lonDeg){
    var phi = latDeg * Math.PI/180, lam = lonDeg * Math.PI/180;

    var Px = cp * Math.sin(lam), Py = Math.sin(phi), Pz = cp * Math.cos(lam);
    var c2 = Math.cos(state.lon), s2 = Math.sin(state.lon);
    var v1x = c2*Px - s2*Pz, v1y = Py, v1z = s2*Px + c2*Pz;
    var cL = Math.cos(state.lat), sL = Math.sin(state.lat);
    return { x: v1x, y: cL*v1y - sL*v1z, z: sL*v1y + cL*v1z };
  }

  function updateMarkers(){
    if(!state.climate || !marks.length) return;
    var cw = canvas.clientWidth, ch = canvas.clientHeight;
    var narrow = cw < 640;
    var m = Math.min(cw, ch) / 2;
    var R = 0.815 * state.zoom;
    for(var i = 0; i < marks.length; i++){
      var mk = marks[i], p = project(mk.lat, mk.lon);
      if(narrow && (i % 2)){ if(mk.el.style.display !== 'none') mk.el.style.display = 'none'; continue; }
      if(p.z <= 0.04){
        if(mk.el.style.display !== 'none') mk.el.style.display = 'none';
        continue;
      }
      if(mk.el.style.display === 'none') mk.el.style.display = '';
      var sx = cw/2 + p.x * R * m;
      var sy = ch/2 - p.y * R * m;
      mk.el.style.transform = 'translate(' + Math.round(sx) + 'px,' + Math.round(sy) + 'px) translate(-50%,-50%)';
      mk.el.style.opacity = Math.min(1, Math.max(0.25, p.z * 2.4)).toFixed(2);
    }
  }

  /* ---- 二维码（指向本页网址） ---- */
  (function(){
    var box = document.getElementById('qrbox');
    try{
      var qr = window.qrcode(0, 'M');
      qr.addData(location.href);
      qr.make();
      box.innerHTML = qr.createSvgTag({cellSize: 4, margin: 0});
    }catch(err){
      try{
        var qr2 = window.qrcode(0, 'M');
        qr2.addData(location.href);
        qr2.make();
        box.innerHTML = qr2.createSvgTag(4, 0);
      }catch(e2){
        document.getElementById('qrcard').style.display = 'none';
      }
    }
  })();

  /* ---- URL 参数（便于直接定制视角/图层） ---- */
  (function(){
    var Q = {};
    var s = location.search.slice(1);
    if(!s) return;
    s.split('&').forEach(function(kv){
      if(!kv) return;
      var p = kv.split('=');
      Q[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    if(Q.lon !== undefined) state.lon = parseFloat(Q.lon) * Math.PI/180;
    if(Q.lat !== undefined) state.lat = parseFloat(Q.lat) * Math.PI/180;
    if(Q.zoom !== undefined) state.zoomTarget = state.zoom = Math.max(0.62, Math.min(1.9, parseFloat(Q.zoom)));
    ['grid','special','borders','rivers','labels','axis','auto','climate'].forEach(function(k){
      if(Q[k] !== undefined) state[k] = (Q[k] !== '0' && Q[k] !== 'false');
    });
    if(Q.season && SEASONS[Q.season]) state.season = Q.season;
    if(Q.faketemp !== undefined) FAKE_TEMP = parseFloat(Q.faketemp);
    if(Q.sat !== undefined) state.sat = (Q.sat !== '0');
  })();
  syncChips();
  if(state.climate) ensureWeather();

  /* ---- 渲染 ---- */
  var t0 = performance.now();
  function frame(now){
    resize();
    var dt = Math.min((now - t0)/1000, 0.05);
    t0 = now;

    if(state.auto && !state.dragging){
      state.lon -= dt * 0.055;
    } else if(!state.dragging){
      state.lon -= state.vLon * 0.35;
      state.vLon *= 0.90;
      if(Math.abs(state.vLon) < 1e-5) state.vLon = 0;
    }

    state.zoom += (state.zoomTarget - state.zoom) * Math.min(dt*9.0, 1.0);

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uLon, state.lon);
    gl.uniform1f(uLat, state.lat);
    gl.uniform1f(uZoom, state.zoom);
    gl.uniform1f(uTime, now/1000);
    gl.uniform1f(uGrid,    state.grid    ? 1 : 0);
    gl.uniform1f(uSpecial, state.special ? 1 : 0);
    gl.uniform1f(uRivers,  state.rivers  ? 1 : 0);
    gl.uniform1f(uLabels,  state.labels  ? 1 : 0);
    gl.uniform1f(uBorders, state.borders ? 1 : 0);
    gl.uniform1f(uAxis,    state.axis    ? 1 : 0);
    gl.uniform1f(uSatMix,  state.sat     ? 1 : 0);
    gl.uniform1f(uTerm,    state.season  ? 1 : 0);
    gl.uniform1f(uDecl,    state.season ? SEASONS[state.season].decl * Math.PI/180 : 0);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    updateMarkers();
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
